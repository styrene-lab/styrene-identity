[package]
name = "styrene-identity-cli"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[[bin]]
name = "idctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
styrene-identity = { path = "../..", version = "0.4.0-rc.2", default-features = false }
styrene-identity-lifecycle = { path = "../../crates/styrene-identity-lifecycle", version = "0.1.0-rc.2", features = ["file-custody"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"
