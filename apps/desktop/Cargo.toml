[package]
name = "styrene-identity-desktop"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[features]
default = []
desktop = ["dioxus/desktop", "dioxus/launch"]

[[bin]]
name = "styrene-identity-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
async-channel = "2"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dioxus = { version = "=0.8.0-alpha.1", default-features = false, features = ["html", "macro", "signals", "hooks", "asset", "document"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
styrene-identity = { path = "../..", version = "0.4.0-rc.2", default-features = false }
styrene-identity-lifecycle = { path = "../../crates/styrene-identity-lifecycle", version = "0.1.0-rc.2", features = ["file-custody"] }
styrene-identity-ui = { path = "../../crates/styrene-identity-ui", version = "0.1.0-rc.2" }
zeroize = "1"

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
