name: Identity contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --locked
      - run: cargo test --locked --features repository-signing,ssh-agent,pki,age-format
      - run: cargo check --locked --lib --no-default-features
      - run: cargo check --locked --lib --no-default-features --features repository-signing
      - run: cargo test --locked --manifest-path tests/minimal-overview-consumer/Cargo.toml
      - run: cargo test --locked -p styrene-identity-lifecycle -p styrene-identity-cli
      - run: cargo check --locked -p styrene-identity-lifecycle --no-default-features
      - run: cargo clippy --locked -p styrene-identity-lifecycle -p styrene-identity-cli --all-targets -- -D warnings
      - run: cargo package --locked
      - if: runner.os == 'macOS'
        run: cargo check --locked --features keychain,yubikey
      - name: Reject test or packaging mutations
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
