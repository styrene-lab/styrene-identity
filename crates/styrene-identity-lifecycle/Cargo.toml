[package]
name = "styrene-identity-lifecycle"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[features]
default = []
file-custody = ["styrene-identity/file-signer", "dep:sha2", "dep:rand_core"]

[dependencies]
async-trait = "0.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
styrene-identity = { path = "../..", version = "0.4.0-rc.1", default-features = false }
thiserror = "2"
sha2 = { version = "0.10", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unsafe_code = "forbid"
